[project]
name = "rag-search-engine"
version = "0.1.0"
description = "A small RAG search engine project for exploring search, retrieval, and LLM-powered results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.8.0",
    "nltk==3.9.1",
    "numpy==2.3.3",
    "openai==2.44.0",
    "python-dotenv==1.2.4",
    "sentence-transformers>=5.4.1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
